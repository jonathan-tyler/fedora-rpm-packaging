worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name _;
    root /srv/repo;
    autoindex on;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
