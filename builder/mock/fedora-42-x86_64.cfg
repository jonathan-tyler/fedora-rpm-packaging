include('/etc/mock/fedora-42-x86_64.cfg')

import os

project_root = os.environ['FEDORA_PACKAGE_BUILDER_ROOT']

config_opts['basedir'] = os.path.join(project_root, 'state', 'mock')
config_opts['resultdir'] = os.path.join(project_root, 'state', 'results', '%(root)s')
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False
config_opts['plugin_conf']['root_cache_enable'] = False
